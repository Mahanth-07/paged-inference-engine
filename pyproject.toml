[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paged-inference-engine"
version = "0.1.0"
description = "A from-scratch LLM inference engine: paged KV cache, continuous batching, custom kernels."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pyyaml",
]

[project.optional-dependencies]
# Laptop: block manager + scheduler + simulator + tests. No torch needed.
dev = ["pytest", "pytest-xdist", "ruff"]
# Laptop + torch: also runs the CPU fixture-model engine tests (paging, chunked
# prefill, preemption, prefix caching) -- the highest-value tests in the repo, and
# they need no GPU.
cpu = ["torch", "fastapi", "httpx", "transformers", "safetensors"]
# Rented GPU box.
gpu = [
    "torch",
    "transformers",
    "safetensors",
    "triton",
    "flashinfer-python",
    "flash-attn",
    "fastapi",
    "uvicorn",
]
# Benchmarking (client + baselines + plots). vllm is the comparison target.
bench = ["aiohttp", "uvloop", "matplotlib", "pandas", "vllm", "datasets"]

[project.scripts]
paged-inference-engine = "paged_inference_engine.entrypoints.cli:main"

[tool.setuptools.packages.find]
include = ["paged_inference_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
