model:
  model: meta-llama/Llama-3.2-1B-Instruct
  dtype: bfloat16
  max_model_len: 4096

cache:
  block_size: 16
  gpu_memory_utilization: 0.90
  enable_prefix_caching: false

scheduler:
  max_num_batched_tokens: 8192
  max_num_seqs: 256
  enable_chunked_prefill: true
  preemption_mode: recompute

attention_backend: flashinfer
enforce_eager: true
